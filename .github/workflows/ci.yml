name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test tests/C0n50le.Tests/C0n50le.Tests.csproj -c Release
      - name: Build the app
        run: dotnet build src/C0n50le/C0n50le.csproj -c Release -r win-x64 -p:Platform=x64
